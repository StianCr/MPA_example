<!DOCTYPE html>
<html lang="no">

<head>
    <meta charset="UTF-8">
    <title>Checkout - Sukkergris</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Checkout</h1>
    <hr>

    <form id="checkoutForm">

        <!-- Steg 1: Kundeinformasjon -->

        <h2>1. Kundeinformasjon</h2>

        <label for="firstName">Fornavn:</label>
        <input type="text" id="firstName" required>

        <br><br>

        <label for="lastName">Etternavn:</label>
        <input type="text" id="lastName" required>

        <br><br>

        <label for="email">E-post:</label>
        <input type="email" id="email" required>

        <br><br>

        <label for="phone">Telefonnummer:</label>
        <input type="tel" id="phone" required>

        <br><br>

        <label for="address">Adresse:</label>
        <input type="text" id="address" required>

        <br><br>

        <label for="zipCode">Postnummer:</label>
        <input type="text" id="zipCode" required>

        <br><br>

        <label for="city">Poststed:</label>
        <input type="text" id="city" required>
       <br><br>

          <label for="country">Land:</label>
        <input type="text" id="country" required>
        <hr>

        <!-- Steg 2: Leveringsmetode -->

        <h2>2. Leveringsmetode</h2>

        <div id="shippingContainer"></div>

        <hr>

        <!-- Steg 3: Bestillingsoversikt -->

        <h2>3. Bestillingsoversikt</h2>

        <p id="productTotal">Produkter: 0 kr</p>

        <p id="shippingPrice">Frakt: Ikke valgt</p>

        <h3 id="totalPrice">Totalpris: 0 kr</h3>

        <button type="submit" id="orderButton" disabled>
            Place order
        </button>

    </form>

    <br>

    <button onclick="window.location.href='index.html'">
        Tilbake til forsiden
    </button>

    <button onclick="window.location.href='shoppingCart.html'">
        Tilbake til handlekurven
    </button>

    <script>

        // Henter handlekurven fra localStorage
        let cart = JSON.parse(localStorage.getItem("cart")) || [];
const groupKey = "HKFUMM51";
        // Henter HTML-elementene
        const productTotal = document.getElementById("productTotal");
        const totalPrice = document.getElementById("totalPrice");
        const checkoutForm = document.getElementById("checkoutForm");
        const shippingContainer = document.getElementById("shippingContainer");
        const shippingPrice = document.getElementById("shippingPrice");
        const orderButton = document.getElementById("orderButton");
// Leveringsmetoder som hentes fra serveren
let shippingMethods = [];

        // Holder styr på valgt leveringsmetode
        let selectedShipping = null;

        // Beregner totalprisen på produktene
        let total = 0;

        for (let item of cart) {

            total += item.price * item.quantity;

        }

        // Viser produktprisen
        productTotal.textContent = `Produkter: ${total} kr`;

        totalPrice.textContent = `Totalpris: ${total} kr`;

        // Viser tilgjengelige leveringsmetoder
        function showShippingMethods() {

            shippingContainer.innerHTML = "";

            for (let method of shippingMethods) {

                const div = document.createElement("div");

                div.innerHTML = `
                    <label>
                        <input
                            type="radio"
                            name="shipping"
                            value="${method.id}"
                            required
                        >
                      ${method.type} - ${method.price} kr
                    </label>
                `;

                shippingContainer.appendChild(div);

                const radioButton = div.querySelector("input");

                // Registrerer hvilken leveringsmetode brukeren velger
                radioButton.addEventListener("change", function () {

                    selectedShipping = method;

                    updateTotal();

                });
            }
        }

        // Oppdaterer totalprisen inkludert frakt
        function updateTotal() {

            if (selectedShipping !== null) {

                shippingPrice.textContent =
                    `Frakt: ${selectedShipping.price} kr`;
                 const finalTotal = total + Number(selectedShipping.price);

                totalPrice.textContent =
                    `Totalpris: ${finalTotal} kr`;

                // Aktiverer knappen hvis handlekurven ikke er tom
                orderButton.disabled = cart.length === 0;

            }
        }

        // Håndterer innsending av skjemaet
       checkoutForm.addEventListener("submit", async function (event) {

            // Hindrer at nettsiden lastes inn på nytt
            event.preventDefault();

            // Kontrollerer at en leveringsmetode er valgt
            if (selectedShipping === null) {

                alert("Du må velge en leveringsmetode.");

                return;
            }

            // Kontrollerer at handlekurven ikke er tom
            if (cart.length === 0) {

                alert("Handlekurven er tom.");

                return;
            }

            // Samler kundeinformasjonen i et objekt
            const customer = {
                firstName: document.getElementById("firstName").value,
                lastName: document.getElementById("lastName").value,
                email: document.getElementById("email").value,
                phone: document.getElementById("phone").value,
                address: document.getElementById("address").value,
                zipCode: document.getElementById("zipCode").value,
                city: document.getElementById("city").value,
                country: document.getElementById("country").value
            };

            // Samler bestillingsinformasjonen i et objekt
            const order = {
                customer: customer,
                products: cart,
                shipping: selectedShipping,
                totalPrice: total + Number(selectedShipping.price)
            };
              const orderData = {
              customer_name: customer.firstName + " " + customer.lastName,
              street: customer.address,
              city: customer.city,
              zipcode: customer.zipCode,
              country: customer.country,
              shipping_id: selectedShipping.id,
              phone: customer.phone,
              email: customer.email,
              content: JSON.stringify(cart) 
};
            console.log(orderData);
            // Lagrer testbestillingen midlertidig i sessionStorage
            sessionStorage.setItem("order", JSON.stringify(order));

            // Sender brukeren videre til ordrebekreftelsen
            window.location.href = "orderConfirmation.html";

        });

    
async function loadShippingMethods() {

    try {
        const response = await fetch(
            `https://sukkergris.onrender.com/logistics/shippingtypes?key=${groupKey}`
        );
        if (!response.ok) {
            throw new Error("Kunne ikke hente leveringsmetoder.");
        }
        const data = await response.json();
          console.log(data);

           shippingMethods = data;
          showShippingMethods();
    } catch (error) {
        console.error(error);
    }
}
   loadShippingMethods();
   </script>
</body>
</html>
